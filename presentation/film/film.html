<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Код прозрачности — фильм</title>
<!--
  Фильм. Каждый кадр — чистая функция времени: render(t) расставляет сцену на момент t,
  render.mjs снимает 30 кадров в секунду и сводит их с music.wav. Разделы и такты —
  timeline.json (100 BPM, такт 2,4 с), общие с музыкой: смены сцен приходятся на сильные доли.

  Вид — система интерфейса сервиса (Code/docs/design-system.md, токены Code/static/css/app.css):
  светлый фон #EFF3F7, белые карточки с радиусом 20 без обводки, тёмный #222B33 для текста
  и тёмных сцен, Onest, метки Geist Mono, риск — точка и слово (высокий, средний, низкий).

  Одна сетка на все сцены. Поля 80 px со всех сторон; сверху строка подписи 1760 × 120
  (слева раздел и заголовок, справа текст), под ней через 40 px тело 1760 × 760.
  Половины тела — 848 | 64 | 848, карточки внутри с полем 40. Сервис показан чёткими снимками
  страниц (capture.mjs), камера ездит по ним; линий-украшений и наложений нет.
-->
<style>
@font-face { font-family: "Onest"; src: url("../../Code/static/fonts/onest-cyrillic-ext-wght-normal.woff2") format("woff2"); font-weight: 100 900; font-display: block; unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F; }
@font-face { font-family: "Onest"; src: url("../../Code/static/fonts/onest-cyrillic-wght-normal.woff2") format("woff2"); font-weight: 100 900; font-display: block; unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
@font-face { font-family: "Onest"; src: url("../../Code/static/fonts/onest-latin-ext-wght-normal.woff2") format("woff2"); font-weight: 100 900; font-display: block; unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
@font-face { font-family: "Onest"; src: url("../../Code/static/fonts/onest-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; font-display: block; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: "Onest"; src: url("../../Code/static/fonts/onest-symbols-wght-normal.woff2") format("woff2"); font-weight: 100 900; font-display: block; unicode-range: U+2190-2199, U+2218-2219, U+2300-243F, U+25A0-27BF; }
@font-face { font-family: "Geist Mono"; src: url("../../Code/static/fonts/geist-mono-cyrillic-wght-normal.woff2") format("woff2"); font-weight: 100 900; font-display: block; unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
@font-face { font-family: "Geist Mono"; src: url("../../Code/static/fonts/geist-mono-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; font-display: block; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }

/* Токены — как в Code/static/css/app.css. */
:root { --canvas: #eff3f7; --card: #ffffff; --control: #f1f4f4; --nav: #dae2ea; --outline: #c3cfda; --text: #222b33;
  --text-2: rgba(34, 43, 51, 0.5); --high: #f92e2e; --medium: #ff941a; --low: #039a00; --positive: #039a00; --cat-2: #b6d3f0;
  --mono: "Geist Mono", ui-monospace, monospace; --sans: "Onest", Arial, sans-serif; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--canvas); }
body { font-family: var(--sans); font-weight: 400; -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }

.scene { position: absolute; inset: 0; overflow: hidden; display: none; }
.scene.on { display: block; }
/* Тёмная сцена (#222B33) и светлая (фон сервиса). */
.dark { background: var(--text); color: #fff; --ink: #fff; --soft: rgba(255,255,255,.6); --hair: rgba(255,255,255,.12); --surface: #2e3842; --chip: #3c4752; }
.light { background: var(--canvas); color: var(--text); --ink: var(--text); --soft: var(--text-2); --hair: rgba(34,43,51,.08); --surface: var(--card); --chip: var(--control); }

.eyebrow { font-family: var(--mono); font-weight: 500; font-size: 18px; letter-spacing: .04em; text-transform: uppercase; line-height: 1.3; }
.h { font-weight: 500; line-height: 1.08; letter-spacing: -.015em; }
.txt { font-size: 26px; line-height: 1.4; font-weight: 400; text-wrap: balance; }
.num { font-weight: 300; line-height: .9; letter-spacing: -.03em; }
.chip { display: inline-flex; align-items: center; height: 36px; padding: 0 12px; border-radius: 10px; background: var(--chip); color: var(--ink); font-size: 20px; line-height: 1; white-space: nowrap; }
.risk { display: inline-flex; align-items: center; gap: 12px; white-space: nowrap; font-size: 22px; }
.risk::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--outline); flex: none; }
.risk.high::before { background: var(--high); } .risk.medium::before { background: var(--medium); } .risk.low::before { background: var(--low); }
.mask { overflow: hidden; display: block; }
.mask > * { display: block; }
.mask > .num { line-height: 1; }
/* Карточка: белая (на тёмной сцене — на тон светлее фона), радиус 20, без обводки. */
.card { position: absolute; background: var(--surface); border-radius: 20px; overflow: hidden; }

/* Строка подписи и тело — общие для всех сцен. */
.cap { position: absolute; left: 80px; top: 80px; width: 1760px; height: 120px; display: grid; grid-template-columns: 848px 848px; column-gap: 64px; }
.cap .l { display: grid; gap: 14px; align-content: end; }
.cap .l .eyebrow { color: var(--soft); }
.cap .r { position: relative; }
.cap .r .tx { position: absolute; left: 0; right: 0; bottom: 0; }
.cap .h { font-size: 60px; }
.body { position: absolute; left: 80px; top: 240px; width: 1760px; height: 760px; }
.L { position: absolute; left: 0; top: 0; width: 848px; height: 760px; }
.R { position: absolute; left: 912px; top: 0; width: 848px; height: 760px; }

/* Окно сервиса: страница в карточке на фоне сервиса. */
.panel { position: absolute; inset: 0; background: #fff; overflow: hidden; border-radius: 20px; }
.panel img { position: absolute; left: 0; top: 0; max-width: none; }
.cursor { position: absolute; width: 30px; height: 30px; left: 0; top: 0; z-index: 5; transform-origin: 3px 3px; opacity: 0; }

/* Списки: строки делят высоту поровну, между строками — тонкий разделитель. */
.rows { position: absolute; inset: 0; display: grid; }
.rows > div { display: grid; align-items: center; border-top: 1px solid var(--hair); position: relative; }
.rows > div:first-child { border-top: 0; }
</style>
</head>
<body>
<div id="stage"></div>

<script>
const D = window.__DATA || {};
const TL = D.timeline || { bpm: 100, sections: [] };
const SHAPE = D.shape || null;
const BOX = D.boxes || {};
const BEAT = 60 / TL.bpm, BAR = 4 * BEAT;
const TW = 0.5;                       // длительность шторки: сцена начинается за TW до сильной доли
const BODY_W = 1760, BODY_H = 760;

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, d) => clamp((t - a) / d);
const outQ = (x) => 1 - Math.pow(1 - clamp(x), 4);
const inOut = (x) => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const lerp = (a, b, k) => a + (b - a) * k;
const $ = (root, sel) => root.querySelector(sel);
const $$ = (root, sel) => [...root.querySelectorAll(sel)];
const fmt = (n, d = 0) => n.toFixed(d).replace(".", ",").replace(/\B(?=(\d{3})+(?!\d))/g, " ");
const el = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstChild; };

// Строка в маске выезжает снизу и уходит вверх.
function line(e, t, at, out = Infinity, dur = 0.7) {
  if (!e) return;
  const a = outQ(prog(t, at, dur)), b = inOut(prog(t, out, 0.45));
  e.style.transform = `translateY(${(1 - a) * 110 - b * 110}%)`;
}

// ------------------------------------------------------------------ подписи
// tx — строка или список {at, text}: текст справа меняется по ходу сцены.
function caption(scene, { ey, ti, tx }) {
  const list = typeof tx === "string" ? [{ at: 0, text: tx }] : tx;
  const cap = el(`<div class="cap"><div class="l"><div class="mask"><p class="eyebrow">${ey}</p></div>
    <div class="mask"><h2 class="h">${ti}</h2></div></div><div class="r"></div></div>`);
  list.forEach((v) => cap.querySelector(".r").appendChild(el(`<div class="tx">${v.html || `<div class="mask"><p class="txt">${v.text}</p></div>`}</div>`)));
  scene.appendChild(cap);
  scene._tx = list;
  scene._cap = { ey, ti };
}
function captionAt(scene, t) {
  const [ey, ti] = $$(scene, ".cap .l .mask > *");
  line(ey, t, TW + 0.05); line(ti, t, TW + 0.15, Infinity, 0.85);
  const blocks = $$(scene, ".cap .tx");
  scene._tx.forEach((v, i) => {
    const at = Math.max(v.at, TW + 0.3), next = scene._tx[i + 1];
    const out = next ? Math.max(next.at, TW + 0.3) - 0.5 : Infinity;
    $$(blocks[i], ".mask > *").forEach((e, k) => line(e, t, at + k * 0.08, out + k * 0.04));
  });
}

// ------------------------------------------------------------------ окно сервиса
// Камера: прямоугольник страницы {x, y, w} в CSS-пикселях снимка; высота — по пропорции окна.
const KH = BODY_H / BODY_W;
function cam(x, y, w) { return { x, y, w }; }
function fitBox(b, pad = 24, wMin = 0) {
  const w = Math.min(1280, Math.max(b.w + pad * 2, (b.h + pad * 2) / KH, wMin));
  // the camera stays on the page: a narrow block near the edge is framed with its neighbours
  return cam(Math.max(0, Math.min(1280 - w, b.x + b.w / 2 - w / 2)), b.y + b.h / 2 - (w * KH) / 2, w);
}
function camAt(stops, t) {            // stops: [{at, cam, dur}]
  let c = stops[0].cam;
  for (const s of stops.slice(1)) {
    const k = inOut(prog(t, s.at, s.dur || 1.2));
    c = { x: lerp(c.x, s.cam.x, k), y: lerp(c.y, s.cam.y, k), w: lerp(c.w, s.cam.w, k) };
  }
  return c;
}
function panel(scene) {
  const p = el(`<div class="panel"></div>`);
  scene.querySelector(".body").appendChild(p);
  const svg = `<svg class="cursor" viewBox="0 0 30 30"><path d="M3 3 L3 24 L8.6 18.8 L12.4 27.2 L16 25.6 L12.3 17.4 L19.8 17.4 Z" fill="#222b33" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
  p.appendChild(el(svg));
  return p;
}
// Слой-снимок: name — файл в shots/, at — его левый верхний угол на странице (для вставок).
function layer(p, name, key) {
  let img = p.querySelector(`img[data-k="${key}"]`);
  if (!img) { img = document.createElement("img"); img.dataset.k = key; p.insertBefore(img, p.querySelector(".cursor")); }
  const src = `shots/${name}.png`;
  if (!img.getAttribute("src")?.endsWith(src)) img.src = src;
  return img;
}
function place(img, c, x, y, w, h, opacity = 1) {
  const s = BODY_W / c.w;
  Object.assign(img.style, { left: (x - c.x) * s + "px", top: (y - c.y) * s + "px", width: w * s + "px", height: h == null ? "auto" : h * s + "px", opacity, display: opacity > 0 ? "block" : "none" });
  return img.style.display === "block" ? img.decode().catch(() => {}) : null;
}
function page(p, name, c, opacity = 1, key = "base") {
  const b = BOX[name] || { w: 1280, h: 720 };
  return place(layer(p, name, key), c, 0, 0, b.w, b.h, opacity);
}
function cursor(p, c, path, t) {        // path: [{at, x, y, dur}], клик — {click: at}
  const cur = p.querySelector(".cursor");
  let pos = path[0], clickK = 0;
  for (const q of path.slice(1)) {
    if (q.click !== undefined) { clickK = Math.max(clickK, 1 - Math.abs(t - q.click) / 0.12); continue; }
    const k = inOut(prog(t, q.at, q.dur || 0.7));
    pos = { x: lerp(pos.x, q.x, k), y: lerp(pos.y, q.y, k) };
  }
  const s = BODY_W / c.w;
  const show = clamp(prog(t, path[0].at - 0.3, 0.3)) * (1 - clamp(prog(t, path.hide ?? Infinity, 0.3)));
  cur.style.opacity = show;
  cur.style.transform = `translate(${(pos.x - c.x) * s - 3}px, ${(pos.y - c.y) * s - 3}px) scale(${1 - 0.18 * clamp(clickK)})`;
}
const mid = (b) => ({ x: b.x + Math.min(b.w / 2, 160), y: b.y + b.h / 2 });

// ------------------------------------------------------------------ сцены
const SC = {};

// Рисунок со страницы входа сервиса (Code/templates/registration/login.html), продлённый в ширину полосы:
// исходный рисунок 300 × 180 стоит в середине (сдвиг 290, 9), слева и справа продолжены те же связи участков.
function art() {
  const grid = Array.from({ length: 30 }, (_, k) => `M${k * 30 + 5} 0V198`).join("");
  const side = "M0 30 70 22 150 48 230 40 300 24M0 120 60 105 140 128 210 96 290 79M90 0 110 60 70 198M180 198 210 96M40 198 60 105M250 0 230 40"
    + "M590 48 680 30 760 62 880 40M590 139 700 120 790 160 880 140M590 159 640 198M700 0 680 30M760 62 790 160M830 0 880 90";
  return `<svg class="art" viewBox="0 0 880 198" preserveAspectRatio="xMidYMid slice" style="position:absolute;left:0;top:0;width:100%;height:100%">
    <path vector-effect="non-scaling-stroke" d="${grid}M0 54H880M0 99H880M0 144H880" stroke="#ffffff" stroke-opacity=".16" stroke-width="1.4" stroke-dasharray="1.4 9"/>
    <path vector-effect="non-scaling-stroke" d="${side}" fill="none" stroke="#ffffff" stroke-opacity=".38" stroke-width="1.6"/>
    <g transform="translate(290 9)">
      <path vector-effect="non-scaling-stroke" d="M10 15 68 22 92 52 182 76 300 39M0 70 20 95 88 85 115 127 205 102 300 130M110 0 105 52M182 0 190 35 239 21M240 20 237 95 300 150M115 127 92 172M205 102 230 145M160 180 205 102" fill="none" stroke="#ffffff" stroke-opacity=".38" stroke-width="1.6"/>
      <path vector-effect="non-scaling-stroke" d="M88 52 155 66 182 103 115 127 88 85Z" fill="#6f8fd0" fill-opacity=".38" stroke="#a9c3f2" stroke-width="2.6"/>
      <path vector-effect="non-scaling-stroke" d="M155 66 190 35 239 21M155 66 115 127" fill="none" stroke="#dce8ff" stroke-width="2.2" stroke-dasharray="9 9"/>
      <circle vector-effect="non-scaling-stroke" cx="155" cy="66" r="4.2" fill="#222b33" stroke="#c2f0b6" stroke-width="2.6"/><circle cx="155" cy="66" r="1.6" fill="#c2f0b6"/>
    </g>
  </svg>`;
}

SC.title = {
  kind: "dark",
  build(s) {
    caption(s, { ey: "Хакатон «Код прозрачности» · 2026", ti: "Риски в кадастре", tx: "Рабочее место специалиста по профилактике коррупции в земельных отношениях" });
    s.querySelector(".body").innerHTML = `
      <div class="fit" style="position:absolute;left:0;top:0;width:1760px"><div class="mask"><h1 class="h big">Земельные решения</h1></div>
        <div class="mask"><h1 class="h big">по данным реестров</h1></div></div>
      <div class="band card" style="left:0;right:0;bottom:0">${art()}</div>`;
  },
  layout(s) { fitPair(s); },
  frame(s, t) {
    captionAt(s, t);
    const [l1, l2] = $$(s, ".big");
    line(l1, t, BEAT * 2, Infinity, 1); line(l2, t, BEAT * 3, Infinity, 1);
    const band = $(s, ".band"), a = outQ(prog(t, BEAT * 5, 1.4));
    band.style.clipPath = `inset(${(1 - a) * 100}% 0 0 0 round 20px)`;
    $(s, ".art").style.transform = `scale(${1.08 - 0.08 * inOut(t / (4 * BAR))})`;
  },
};

// Две строки одного кегля без растягивания: 150 px или меньше, если длинная строка не помещается;
// под ними карточка с рисунком до низа тела.
function fitPair(s) {
  const big = $$(s, ".big");
  big.forEach((e) => { e.style.fontSize = "150px"; e.style.whiteSpace = "nowrap"; e.style.display = "inline-block"; });
  const w = Math.max(...big.map((e) => e.getBoundingClientRect().width));
  const size = Math.min(150, Math.floor(150 * BODY_W / w));
  big.forEach((e) => { e.style.fontSize = size + "px"; e.style.display = "block"; });
  const h = $(s, ".fit").getBoundingClientRect().height;
  const band = $(s, ".band");
  if (band) band.style.top = h + 40 + "px";
  return size;
}

SC.problem = {
  kind: "light",
  build(s) {
    caption(s, { ey: "01 / проблема", ti: "Восемь источников", tx: "Сведения об одном объекте хранятся в восьми источниках. Основание для проверки даёт сопоставление дат и лиц." });
    const names = ["НСПД", "ЕГРН", "ЕГРЮЛ", "ГИС «Торги»", "Кадастровая оценка", "Акты субъектов РФ", "Сайты муниципалитетов", "Протоколы комиссий"];
    s.querySelector(".body").innerHTML = `
      <div class="L card"><div class="num cnt" style="font-size:480px;position:absolute;left:24px;top:28px">0</div>
        <div style="position:absolute;left:40px;bottom:40px"><div class="mask"><p class="txt lab" style="font-size:36px">источников на один объект</p></div></div></div>
      <div class="R card"><div class="rows" style="grid-template-rows:repeat(8,1fr);left:40px;right:40px">${names.map((n, i) =>
        `<div style="grid-template-columns:80px 1fr"><span class="eyebrow" style="color:var(--soft)">${String(i + 1).padStart(2, "0")}</span><span class="txt" style="font-size:30px">${n}</span></div>`).join("")}</div>
        <div class="one" style="position:absolute;left:0;right:0;bottom:0;background:var(--text);color:#fff;border-radius:20px;display:grid;align-content:end;gap:16px;padding:40px">
          <p class="eyebrow" style="color:rgba(255,255,255,.6)">Код прозрачности</p><p class="h" style="font-size:88px">Карточка объекта</p></div></div>`;
  },
  frame(s, t) {
    captionAt(s, t);
    const rows = $$(s, ".rows > div");
    const merge = inOut(prog(t, TW + BAR * 3 - 0.2, 1.1));
    let n = 0;
    rows.forEach((r, i) => {
      const at = TW + BEAT * (1 + i);
      const a = outQ(prog(t, at, 0.6));
      if (t >= at) n++;
      r.style.opacity = a * (1 - merge);
      r.style.transform = `translateX(${(1 - a) * 40}px)`;
    });
    $(s, ".cnt").textContent = n;
    $(s, ".cnt").style.opacity = n ? 1 : 0;
    line($(s, ".lab"), t, TW + BEAT);
    const one = $(s, ".one");
    one.style.height = merge * BODY_H + "px";
    one.style.opacity = merge > 0 ? 1 : 0;
  },
};

SC.mechanisms = {
  kind: "light",
  build(s) {
    caption(s, { ey: "02 / что ищем", ti: "Три механизма риска", tx: "Семь правил исследования объединены в три механизма. У каждого правила свой расчёт и свой вес: высокий, средний или низкий." });
    const W = { high: "высокий", medium: "средний", low: "низкий" };
    const items = [
      ["#1 / И1, И3, И6", "Сделка перед решением", "Участок покупают незадолго до смены категории, покупатель связан с участником решения, после решения участок продают с выгодой.",
        [["И1", "Покупка до смены категории", "medium"], ["И3", "Выгода после смены категории", "low"], ["И6", "Связанное лицо до процедуры", "medium"]]],

    s.querySelector(".body").innerHTML = `<div class="card" style="left:0;top:0;width:100%;height:100%"><div class="rows" style="grid-template-rows:repeat(4,1fr);left:40px;right:40px">${items.map((x, i) => `
      <div style="grid-template-columns:120px 1fr"><span class="eyebrow" style="color:var(--soft)">${String(i + 1).padStart(2, "0")}</span><div class="mask"><p class="h pr" style="white-space:nowrap">${x}</p></div></div>`).join("")}</div></div>`;
  },
  layout(s) {
    const ps = $$(s, ".pr");
    ps.forEach((e) => { e.style.fontSize = "100px"; e.style.display = "inline-block"; });
    const w = Math.max(...ps.map((e) => e.getBoundingClientRect().width));
    const size = Math.min(104, Math.floor(100 * (BODY_W - 80 - 120) / w));
    ps.forEach((e) => { e.style.fontSize = size + "px"; e.style.display = "block"; });
  },
  frame(s, t) {
    captionAt(s, t);
    $$(s, ".rows > div").forEach((r, i) => {
      const at = TW + 0.5 + i * BAR * 0.75;
      r.style.opacity = outQ(prog(t, at - 0.1, 0.3));
      line(r.querySelector(".pr"), t, at, Infinity, 0.9);
    });
  },
};

SC.outro = {
  kind: "dark",
  build(s) {
    caption(s, { ey: "Код прозрачности · 2026", ti: "Zeus Analytics", tx: [{ at: 0, sub: "Код github.com/EthanNewell/Zeus_Analytics, демо oskarasadullin.github.io/kod-prozrachnosti.", html: `<div class="mask"><p class="txt">github.com/EthanNewell/Zeus_Analytics</p></div><div class="mask"><p class="txt">oskarasadullin.github.io/kod-prozrachnosti</p></div>` }] });
    s.querySelector(".body").innerHTML = `
      <div class="fit" style="position:absolute;left:0;top:0;width:1760px"><div class="mask"><h1 class="h big">Индикатор —</h1></div>
        <div class="mask"><h1 class="h big">повод для проверки</h1></div></div>
      <div class="band card" style="left:0;right:0;bottom:0">${art()}</div>`;
  },
  layout(s) { fitPair(s); },
  frame(s, t) {
    captionAt(s, t);
    const [l1, l2] = $$(s, ".big");
    line(l1, t, TW + 0.3, Infinity, 1); line(l2, t, TW + 0.3 + BEAT, Infinity, 1);
    const band = $(s, ".band"), a = outQ(prog(t, TW + BEAT * 3, 1.4));
    band.style.clipPath = `inset(${(1 - a) * 100}% 0 0 0 round 20px)`;
    $(s, ".art").style.transform = `scale(${1 + 0.08 * inOut(t / (4 * BAR + 4))})`;
    const veil = $(s, ".veil");
    veil.style.opacity = inOut(prog(t, TW + 4 * BAR - 0.4, 3));
  },
};

// ------------------------------------------------------------------ сборка
const stage = document.getElementById("stage");
const starts = []; let acc = 0;
for (const sec of TL.sections) { starts.push(acc); acc += sec.bars * BAR; }
const END = acc;
for (const sec of TL.sections) {
  const def = SC[sec.id];
  const s = el(`<section class="scene ${def.kind}" id="${sec.id}"><div class="body"></div></section>`);
  stage.appendChild(s);
  def.build(s);
  if (sec.id === "outro") s.appendChild(el(`<div class="veil" style="position:absolute;inset:0;background:var(--text);opacity:0;z-index:9"></div>`));
}
// Шрифт грузится только когда нужен: подгрузить все наборы до замера строк по ширине.
const ready = Promise.all(['400 100px "Onest"', '500 100px "Onest"', '300 100px "Onest"', '500 18px "Geist Mono"'].map((f) => document.fonts.load(f, "Риски Zeus 0123 →²"))).then(() => document.fonts.ready).then(() => {
  for (const sec of TL.sections) {
    const s = document.getElementById(sec.id);
    if (SC[sec.id].layout) { s.classList.add("on"); SC[sec.id].layout(s); s.classList.remove("on"); }
  }
});

// Сцена i живёт от starts[i] − TW (начало шторки) до starts[i+1]; локальное время отсчитывается от начала шторки.
const begin = (i) => (i === 0 ? 0 : starts[i] - TW);
async function render(t) {
  await ready;
  let i = 0;
  for (let k = 0; k < starts.length; k++) if (t >= begin(k)) i = k;
  const cur = TL.sections[i], prev = i > 0 && t < starts[i] ? TL.sections[i - 1] : null;
  document.querySelectorAll(".scene").forEach((s) => {
    const on = s.id === cur.id || (prev && s.id === prev.id);
    s.classList.toggle("on", on);
    s.style.zIndex = s.id === cur.id ? 2 : 1;
    s.style.clipPath = ""; s.style.transform = "";
  });
  const jobs = [];
  const sc = document.getElementById(cur.id);
  jobs.push(SC[cur.id].frame(sc, t - begin(i)));
  if (prev) {
    const ps = document.getElementById(prev.id);
    jobs.push(SC[prev.id].frame(ps, t - begin(i - 1)));
    const k = inOut(prog(t, begin(i), TW));
    sc.style.clipPath = `inset(${(1 - k) * 100}% 0 0 0)`;
    ps.style.transform = `translateY(${-k * 120}px)`;
  }
  await Promise.all(jobs);
}
window.render = render;
window.FILM_END = END;

// Субтитры: заголовок и текст подписи каждой сцены с их временем — дорожка в mp4 (render.mjs).
const plain = (h) => { const d = document.createElement("div"); d.innerHTML = h; return d.innerText.replace(/\s+/g, " ").trim(); };
window.SUBTITLES = TL.sections.flatMap((sec, i) => {
  const s = document.getElementById(sec.id), end = i + 1 < starts.length ? begin(i + 1) : END + 4;
  return s._tx.map((v, k) => {
    const from = begin(i) + Math.max(v.at, TW + 0.3), next = s._tx[k + 1];
    const text = v.sub || v.text || plain(v.html);
    return { from, to: next ? begin(i) + Math.max(next.at, TW + 0.3) : end, text: `${s._cap.ti}. ${text}` };
  });
});
</script>
</body>
</html>
