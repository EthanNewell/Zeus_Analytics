<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Код прозрачности — фильм</title>
<!--
  Фильм. Каждый кадр — чистая функция времени: render(t) расставляет сцену на момент t,
  render.mjs снимает 30 кадров в секунду и сводит их с music.wav. Разделы и такты —
  timeline.json (100 BPM, такт 2,4 с), общие с музыкой: смены сцен приходятся на сильные доли.

  Одна сетка на все сцены. Поля 80 px со всех сторон; сверху строка подписи 1760 × 120
  (слева раздел и заголовок, справа текст), под ней через 40 px тело 1760 × 760.
  Половины тела — 848 | 64 | 848. Сервис показан чёткими снимками страниц (capture.mjs),
  камера ездит по ним; линий-украшений и наложений нет.
-->
<style>
@font-face { font-family: "SG"; src: url("../../Code/static/fonts/science-gothic-cyrillic.woff2") format("woff2");
  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; font-weight: 100 900; font-stretch: 50% 200%; font-display: block; }
@font-face { font-family: "SG"; src: url("../../Code/static/fonts/science-gothic-latin.woff2") format("woff2");
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329,
  U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; font-weight: 100 900; font-stretch: 50% 200%; font-display: block; }
@font-face { font-family: "SG"; src: url("../../Code/static/fonts/science-gothic-symbols.woff2") format("woff2");
  unicode-range: U+2074, U+2080, U+2192, U+2244-2248, U+2260, U+2264-2265; font-weight: 100 900; font-stretch: 50% 200%; font-display: block; }

:root { --blue: #0000e8; --grey: #ededed; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--blue); }
body { font-family: "SG", Arial, sans-serif; font-weight: 250; font-stretch: 72%; -webkit-font-smoothing: antialiased; }

.scene { position: absolute; inset: 0; overflow: hidden; display: none; }
.scene.on { display: block; }
.blue { background: var(--blue); color: #fff; --ink: #fff; --soft: rgba(255,255,255,.72); --hair: rgba(255,255,255,.24); --fill: rgba(255,255,255,.14); --chip: #fff; --chip-ink: var(--blue); }
.grey { background: var(--grey); color: #000; --ink: #000; --soft: rgba(0,0,0,.62); --hair: rgba(0,0,0,.14); --fill: #fff; --chip: var(--blue); --chip-ink: #fff; }

.eyebrow { font-weight: 400; font-size: 18px; letter-spacing: .2em; text-transform: uppercase; line-height: 1.2; }
.h { font-weight: 200; font-stretch: 62%; text-transform: uppercase; line-height: 1; letter-spacing: -.004em; }
.txt { font-size: 26px; line-height: 1.4; font-weight: 250; text-wrap: balance; }
.num { font-weight: 100; font-variant-numeric: tabular-nums; line-height: .82; letter-spacing: -.01em; }
.chip { display: inline-block; font-weight: 400; font-size: 18px; letter-spacing: .12em; padding: 6px 10px 5px; background: var(--chip); color: var(--chip-ink); line-height: 1; }
.mask { overflow: hidden; display: block; }
.mask > * { display: block; }
.mask > .num { line-height: 1; }

/* Строка подписи и тело — общие для всех сцен. */
.cap { position: absolute; left: 80px; top: 80px; width: 1760px; height: 120px; display: grid; grid-template-columns: 848px 848px; column-gap: 64px; }
.cap .l { display: grid; gap: 14px; align-content: end; }
.cap .r { position: relative; }
.cap .r .tx { position: absolute; left: 0; right: 0; bottom: 0; }
.cap .h { font-size: 64px; }
.body { position: absolute; left: 80px; top: 240px; width: 1760px; height: 760px; }
.L { position: absolute; left: 0; top: 0; width: 848px; height: 760px; }
.R { position: absolute; left: 912px; top: 0; width: 848px; height: 760px; }

/* Окно сервиса: белая страница на сером поле, без обводки. */
.panel { position: absolute; inset: 0; background: #fff; overflow: hidden; }
.panel img { position: absolute; left: 0; top: 0; max-width: none; }
.cursor { position: absolute; width: 30px; height: 30px; left: 0; top: 0; z-index: 5; transform-origin: 3px 3px; opacity: 0; }

/* Списки: строки делят высоту поровну, между строками — тонкий разделитель. */
.rows { position: absolute; inset: 0; display: grid; }
.rows > div { display: grid; align-items: center; border-top: 1px solid var(--hair); position: relative; }
.rows > div:first-child { border-top: 0; }
</style>
</head>
<body>
<div id="stage"></div>

<script>
const D = window.__DATA || {};
const TL = D.timeline || { bpm: 100, sections: [] };
const SHAPE = D.shape || null;
const BOX = D.boxes || {};
const BEAT = 60 / TL.bpm, BAR = 4 * BEAT;
const TW = 0.5;                       // длительность шторки: сцена начинается за TW до сильной доли
const BODY_W = 1760, BODY_H = 760;

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, d) => clamp((t - a) / d);
const outQ = (x) => 1 - Math.pow(1 - clamp(x), 4);
const inOut = (x) => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const lerp = (a, b, k) => a + (b - a) * k;
const $ = (root, sel) => root.querySelector(sel);
const $$ = (root, sel) => [...root.querySelectorAll(sel)];
const fmt = (n, d = 0) => n.toFixed(d).replace(".", ",").replace(/\B(?=(\d{3})+(?!\d))/g, " ");
const el = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstChild; };

// Строка в маске выезжает снизу и уходит вверх.
function line(e, t, at, out = Infinity, dur = 0.7) {
  if (!e) return;
  const a = outQ(prog(t, at, dur)), b = inOut(prog(t, out, 0.45));
  e.style.transform = `translateY(${(1 - a) * 110 - b * 110}%)`;
}

// ------------------------------------------------------------------ подписи
// tx — строка или список {at, text}: текст справа меняется по ходу сцены.
function caption(scene, { ey, ti, tx }) {
  const list = typeof tx === "string" ? [{ at: 0, text: tx }] : tx;
  const cap = el(`<div class="cap"><div class="l"><div class="mask"><p class="eyebrow">${ey}</p></div>
    <div class="mask"><h2 class="h">${ti}</h2></div></div><div class="r"></div></div>`);
  list.forEach((v) => cap.querySelector(".r").appendChild(el(`<div class="tx">${v.html || `<div class="mask"><p class="txt">${v.text}</p></div>`}</div>`)));
  scene.appendChild(cap);
  scene._tx = list;
}
function captionAt(scene, t) {
  const [ey, ti] = $$(scene, ".cap .l .mask > *");
  line(ey, t, TW + 0.05); line(ti, t, TW + 0.15, Infinity, 0.85);
  const blocks = $$(scene, ".cap .tx");
  scene._tx.forEach((v, i) => {
    const at = Math.max(v.at, TW + 0.3), next = scene._tx[i + 1];
    const out = next ? Math.max(next.at, TW + 0.3) - 0.5 : Infinity;
    $$(blocks[i], ".mask > *").forEach((e, k) => line(e, t, at + k * 0.08, out + k * 0.04));
  });
}

// ------------------------------------------------------------------ окно сервиса
// Камера: прямоугольник страницы {x, y, w} в CSS-пикселях снимка; высота — по пропорции окна.
const KH = BODY_H / BODY_W;
function cam(x, y, w) { return { x, y, w }; }
function fitBox(b, pad = 24, wMin = 0) {
  const w = Math.max(b.w + pad * 2, (b.h + pad * 2) / KH, wMin);
  return cam(b.x + b.w / 2 - w / 2, b.y + b.h / 2 - (w * KH) / 2, w);
}
function camAt(stops, t) {            // stops: [{at, cam, dur}]
  let c = stops[0].cam;
  for (const s of stops.slice(1)) {
    const k = inOut(prog(t, s.at, s.dur || 1.2));
    c = { x: lerp(c.x, s.cam.x, k), y: lerp(c.y, s.cam.y, k), w: lerp(c.w, s.cam.w, k) };
  }
  return c;
}
function panel(scene) {
  const p = el(`<div class="panel"></div>`);
  scene.querySelector(".body").appendChild(p);
  const svg = `<svg class="cursor" viewBox="0 0 30 30"><path d="M3 3 L3 24 L8.6 18.8 L12.4 27.2 L16 25.6 L12.3 17.4 L19.8 17.4 Z" fill="#000" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
  p.appendChild(el(svg));
  return p;
}
// Слой-снимок: name — файл в shots/, at — его левый верхний угол на странице (для вставок).
function layer(p, name, key) {
  let img = p.querySelector(`img[data-k="${key}"]`);
  if (!img) { img = document.createElement("img"); img.dataset.k = key; p.insertBefore(img, p.querySelector(".cursor")); }
  const src = `shots/${name}.png`;
  if (!img.getAttribute("src")?.endsWith(src)) img.src = src;
  return img;
}
function place(img, c, x, y, w, h, opacity = 1) {
  const s = BODY_W / c.w;
  Object.assign(img.style, { left: (x - c.x) * s + "px", top: (y - c.y) * s + "px", width: w * s + "px", height: h == null ? "auto" : h * s + "px", opacity, display: opacity > 0 ? "block" : "none" });
  return img.style.display === "block" ? img.decode().catch(() => {}) : null;
}
function page(p, name, c, opacity = 1, key = "base") {
  const b = BOX[name] || { w: 1280, h: 720 };
  return place(layer(p, name, key), c, 0, 0, b.w, b.h, opacity);
}
function cursor(p, c, path, t) {        // path: [{at, x, y, dur}], клик — {click: at}
  const cur = p.querySelector(".cursor");
  let pos = path[0], clickK = 0;
  for (const q of path.slice(1)) {
    if (q.click !== undefined) { clickK = Math.max(clickK, 1 - Math.abs(t - q.click) / 0.12); continue; }
    const k = inOut(prog(t, q.at, q.dur || 0.7));
    pos = { x: lerp(pos.x, q.x, k), y: lerp(pos.y, q.y, k) };
  }
  const s = BODY_W / c.w;
  const show = clamp(prog(t, path[0].at - 0.3, 0.3)) * (1 - clamp(prog(t, path.hide ?? Infinity, 0.3)));
  cur.style.opacity = show;
  cur.style.transform = `translate(${(pos.x - c.x) * s - 3}px, ${(pos.y - c.y) * s - 3}px) scale(${1 - 0.18 * clamp(clickK)})`;
}
const mid = (b) => ({ x: b.x + Math.min(b.w / 2, 160), y: b.y + b.h / 2 });

// ------------------------------------------------------------------ сцены
const SC = {};

SC.title = {
  kind: "blue",
  build(s) {
    caption(s, { ey: "Хакатон «Код прозрачности» · 2026", ti: "Zeus Analytics", tx: "Рабочее место специалиста по профилактике коррупции в земельных отношениях" });
    s.querySelector(".body").innerHTML = `
      <div class="fit" style="position:absolute;left:0;top:0;width:1760px"><div class="mask"><h1 class="h big">Риски в кадастре</h1></div>
        <div class="mask"><h1 class="h big">видны по фактам</h1></div></div>
      <div class="band" style="position:absolute;left:0;right:0;bottom:0;overflow:hidden"><img src="../../Code/static/img/hero.jpg" style="position:absolute;left:0;width:100%;object-fit:cover" alt="" /></div>`;
  },
  layout(s) { fitPair(s, 0); },
  frame(s, t) {
    captionAt(s, t);
    const [l1, l2] = $$(s, ".big");
    line(l1, t, BEAT * 2, Infinity, 1); line(l2, t, BEAT * 3, Infinity, 1);
    const band = $(s, ".band"), a = outQ(prog(t, BEAT * 5, 1.4));
    band.style.clipPath = `inset(${(1 - a) * 100}% 0 0 0)`;
    const img = band.querySelector("img");
    img.style.top = `${-420 + 160 * inOut(t / (4 * BAR))}px`; img.style.height = "1760px";
  },
};

// Две строки одинакового кегля: длинная — во всю ширину; под ними полоса гравюры до низа тела.
function fitPair(s) {
  const big = $$(s, ".big");
  big.forEach((e) => { e.style.fontSize = "200px"; e.style.whiteSpace = "nowrap"; e.style.display = "inline-block"; });
  const w = Math.max(...big.map((e) => e.getBoundingClientRect().width));
  const size = Math.floor(200 * BODY_W / w);
  big.forEach((e) => { e.style.fontSize = size + "px"; e.style.display = "block"; });
  const h = $(s, ".fit").getBoundingClientRect().height;
  const band = $(s, ".band");
  if (band) band.style.top = h + 40 + "px";
  return size;
}

SC.problem = {
  kind: "blue",
  build(s) {
    caption(s, { ey: "01 / проблема", ti: "Факты разбросаны", tx: "По отдельности каждый факт законен. Повод для проверки — в сочетании дат и лиц." });
    const names = ["НСПД", "ЕГРН", "ЕГРЮЛ", "ГИС «Торги»", "Кадастровая оценка", "Акты региона", "Сайты муниципалитетов", "Протоколы комиссий"];
    s.querySelector(".body").innerHTML = `
      <div class="L"><div class="num cnt" style="font-size:520px;position:absolute;left:-14px;top:0">0</div>
        <div style="position:absolute;left:0;bottom:0"><div class="mask"><p class="txt lab" style="font-size:40px">источников на один объект</p></div></div></div>
      <div class="R"><div class="rows" style="grid-template-rows:repeat(8,1fr)">${names.map((n, i) =>
        `<div style="grid-template-columns:80px 1fr"><span class="eyebrow" style="opacity:.6">${String(i + 1).padStart(2, "0")}</span><span class="txt" style="font-size:32px">${n}</span></div>`).join("")}</div>
        <div class="one" style="position:absolute;left:0;right:0;bottom:0;background:#fff;color:var(--blue);display:grid;align-content:end;padding:40px">
          <p class="eyebrow">Код прозрачности</p><p class="h" style="font-size:96px;margin-top:16px">один экран</p></div></div>`;
  },
  frame(s, t) {
    captionAt(s, t);
    const rows = $$(s, ".rows > div");
    const merge = inOut(prog(t, TW + BAR * 3 - 0.2, 1.1));
    let n = 0;
    rows.forEach((r, i) => {
      const at = TW + BEAT * (1 + i);
      const a = outQ(prog(t, at, 0.6));
      if (t >= at) n++;
      r.style.opacity = a * (1 - merge);
      r.style.transform = `translateX(${(1 - a) * 40}px)`;
    });
    $(s, ".cnt").textContent = n;
    $(s, ".cnt").style.opacity = n ? 1 : 0;
    line($(s, ".lab"), t, TW + BEAT);
    const one = $(s, ".one");
    one.style.height = merge * BODY_H + "px";
    one.style.opacity = merge > 0 ? 1 : 0;
  },
};

SC.mechanisms = {
  kind: "blue",
  build(s) {
    caption(s, { ey: "02 / что ищем", ti: "Три механизма риска", tx: "Семь правил исследования сведены к трём схемам. Каждое правило — отдельный сигнал со своим расчётом." });
    const items = [["m1", "#1 / И1, И3, И6", "Сделка перед решением"], ["m2", "#2 / И2, И4, И10", "Решение под владельца"], ["m3", "#3 / И8", "Граница с изломом"]];
    s.querySelector(".body").innerHTML = `<div style="position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);gap:32px">${items.map(([img, ey, ti]) => `
      <figure class="m" style="position:relative;display:grid;grid-template-rows:1fr 150px">
        <div style="overflow:hidden;position:relative"><img src="../../Code/static/img/${img}.jpg" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover" alt="" /></div>
        <div style="display:grid;align-content:end;gap:14px"><div class="mask"><p class="eyebrow">${ey}</p></div><div class="mask"><p class="h" style="font-size:52px">${ti}</p></div></div>
      </figure>`).join("")}</div>`;
  },
  frame(s, t) {
    captionAt(s, t);
    $$(s, ".m").forEach((m, i) => {
      const at = TW + BEAT * 2 + i * BEAT * 2.5;
      const a = outQ(prog(t, at, 1));
      const box = m.firstElementChild;
      box.style.clipPath = `inset(${(1 - a) * 100}% 0 0 0)`;
      box.querySelector("img").style.transform = `scale(${1.18 - 0.12 * a + 0.05 * inOut(prog(t, TW + BAR * 2.5, BAR * 1.5))})`;
      $$(m, ".mask > *").forEach((e, k) => line(e, t, at + 0.35 + k * 0.1));
    });
  },
};

SC.login = {
  kind: "grey",
  build(s) {
    caption(s, { ey: "03 / вход", ti: "Доступ по ролям", tx: "Специалист, проверяющий и руководитель видят своё. Учётные записи выдаёт администратор." });
    s._p = panel(s);
  },
  frame(s, t) {
    captionAt(s, t);
    const p = s._p, b = BOX.login, n = BOX.loginTyped || 16;
    const c = camAt([{ cam: cam(0, 158, 1280) }, { at: TW + 4.6, cam: cam(0, 0, 1280), dur: 1.6 }], t);
    const Tu = TW + 1.3, Tp = TW + 2.4, click = TW + 4.0, nu = BOX.loginUser || 4;
    const typed = clamp(Math.ceil((t - Tu) / 0.13), 0, nu) + clamp(Math.ceil((t - Tp) / 0.1), 0, n - nu);
    const done = clamp(prog(t, click + 0.15, 0.5));
    const w = [page(p, typed ? `login-${String(typed).padStart(2, "0")}` : "login", c, 1 - done),
      page(p, "overview", c, done, "next")];
    const u = b.user, pw = b.pass, sb = b.submit;
    cursor(p, c, Object.assign([{ at: TW + 0.4, x: 860, y: 520 }, { at: TW + 0.6, x: mid(u).x, y: u.y + 26 }, { click: TW + 1.15 },
      { at: TW + 1.75, x: mid(pw).x, y: pw.y + 26, dur: 0.45 }, { click: TW + 2.25 },
      { at: TW + 3.3, x: sb.x + sb.w / 2, y: sb.y + 26, dur: 0.6 }, { click }], { hide: click + 0.4 }), t);
    return Promise.all(w);
  },
};

SC.data = {
  kind: "grey",
  build(s) {
    const st = [["70", "записей"], ["50", "объектов"], ["31", "сигнал"], ["17 мс", "весь анализ"]];
    caption(s, { ey: "04 / данные", ti: "Таблицы как есть", tx: [
      { at: 0, text: "Семь таблиц исследования, Excel или CSV. Повторная загрузка не дублирует записи: 0 новых из 10." },
      { at: TW + BAR * 3, html: `<div style="display:grid;grid-template-columns:repeat(4,1fr);column-gap:32px">${st.map(([v, l]) =>
        `<div style="display:grid;gap:12px"><div class="mask"><div class="num stat" data-v="${v}" style="font-size:72px">0</div></div><div class="mask"><p class="eyebrow">${l}</p></div></div>`).join("")}</div>` }] });
    s._p = panel(s);
  },
  frame(s, t) {
    captionAt(s, t);
    const p = s._p, b = BOX.upload, click = TW + 2.2;
    const done = clamp(prog(t, click + 0.15, 0.5));
    const cu = cam(0, 470, 1280);
    const cp = camAt([{ cam: cam(0, 0, 1280) }, { at: TW + BAR * 2, cam: cam(0, 330, 1280), dur: 2.4 }, { at: TW + BAR * 3.6, cam: cam(0, 700, 1280), dur: 2.6 }], t);
    const c = done < 1 ? cu : cp;
    const w = [page(p, "upload", cu, 1 - done), page(p, "passport", cp, done, "next")];
    const sb = b.submit;
    cursor(p, c, Object.assign([{ at: TW + 0.6, x: 980, y: 1000 }, { at: TW + 0.9, x: sb.x + sb.w / 2, y: sb.y + 26, dur: 0.8 }, { click }], { hide: click + 0.4 }), t);
    const k = outQ(prog(t, TW + BAR * 3 + 0.2, 1.6));
    $$(s, ".stat").forEach((e) => { const v = e.dataset.v, n = parseInt(v); e.textContent = Math.round(n * k) + (v.includes("мс") ? " мс" : ""); });
    return Promise.all(w);
  },
};

SC.registry = {
  kind: "grey",
  build(s) {
    caption(s, { ey: "05 / реестр", ti: "Сначала главное", tx: "Восемь объектов с высоким приоритетом. Пять уровней приоритета — процента коррупции нет намеренно." });
    s._p = panel(s);
  },
  frame(s, t) {
    captionAt(s, t);
    const tb = BOX.registry.table;
    const c = camAt([{ cam: cam(0, 0, 1280) }, { at: TW + 1.4, cam: cam(0, tb.y - 290, 1280), dur: 2.2 }, { at: TW + 4.6, cam: cam(28, tb.y - 40, 1224), dur: 3.6 }], t);
    return page(s._p, "registry", c);
  },
};

SC.card = {
  kind: "grey",
  build(s) {
    caption(s, { ey: "06 / карточка", ti: "Почему объект в реестре", tx: [
      { at: 0, text: "Аксайский район, 61:02:0600010:2843. Три правила из четырёх сработали, каждое — со своим расчётом." },
      { at: TW + BAR * 1.5, text: "И6. Участок куплен за 75 дней до начала процедуры; участник решения был учредителем покупателя." },
      { at: TW + BAR * 3.5, text: "И10. То же должностное лицо — ещё в пяти эпизодах других правил." },
      { at: TW + BAR * 5, text: "И1. Категорию земли сменили через 271 день после регистрации права." },

// ------------------------------------------------------------------ сборка
const stage = document.getElementById("stage");
const starts = []; let acc = 0;
for (const sec of TL.sections) { starts.push(acc); acc += sec.bars * BAR; }
const END = acc;
for (const sec of TL.sections) {
  const def = SC[sec.id];
  const s = el(`<section class="scene ${def.kind}" id="${sec.id}"><div class="body"></div></section>`);
  stage.appendChild(s);
  def.build(s);
  if (sec.id === "outro") s.appendChild(el(`<div class="veil" style="position:absolute;inset:0;background:var(--blue);opacity:0;z-index:9"></div>`));
}
// Шрифт грузится только когда нужен: подгрузить все наборы до замера строк по ширине.
const ready = Promise.all(["Риски", "Zeus", "→≈"].map((x) => document.fonts.load('200 100px "SG"', x))).then(() => document.fonts.ready).then(() => {
  for (const sec of TL.sections) {
    const s = document.getElementById(sec.id);
    if (SC[sec.id].layout) { s.classList.add("on"); SC[sec.id].layout(s); s.classList.remove("on"); }
  }
});

// Сцена i живёт от starts[i] − TW (начало шторки) до starts[i+1]; локальное время отсчитывается от начала шторки.
const begin = (i) => (i === 0 ? 0 : starts[i] - TW);
async function render(t) {
  await ready;
  let i = 0;
  for (let k = 0; k < starts.length; k++) if (t >= begin(k)) i = k;
  const cur = TL.sections[i], prev = i > 0 && t < starts[i] ? TL.sections[i - 1] : null;
  document.querySelectorAll(".scene").forEach((s) => {
    const on = s.id === cur.id || (prev && s.id === prev.id);
    s.classList.toggle("on", on);
    s.style.zIndex = s.id === cur.id ? 2 : 1;
    s.style.clipPath = ""; s.style.transform = "";
  });
  const jobs = [];
  const sc = document.getElementById(cur.id);
  jobs.push(SC[cur.id].frame(sc, t - begin(i)));
  if (prev) {
    const ps = document.getElementById(prev.id);
    jobs.push(SC[prev.id].frame(ps, t - begin(i - 1)));
    const k = inOut(prog(t, begin(i), TW));
    sc.style.clipPath = `inset(${(1 - k) * 100}% 0 0 0)`;
    ps.style.transform = `translateY(${-k * 120}px)`;
  }
  await Promise.all(jobs);
}
window.render = render;
window.FILM_END = END;
