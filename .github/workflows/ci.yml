name: Django CI
on:
  pull_request:
    paths: ["Code/**", ".github/workflows/ci.yml"]
  push:
    branches: [main]
    paths: ["Code/**", ".github/workflows/ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Code
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DB_ENGINE: mysql
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_DATABASE: transparency
      MYSQL_USER: root
      MYSQL_PASSWORD: ci-only-root-password
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-root-password
          MYSQL_DATABASE: transparency
          MYSQL_ROOT_HOST: "%"
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s --health-timeout=5s
          --health-start-period=20s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "Code/requirements*.txt"
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev build-essential pkg-config
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-mysql.txt
      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Check Django and migrations
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python manage.py bootstrap_roles
      - name: Run tests with MySQL
        run: python manage.py test --verbosity 2
      - name: Build application image
        run: docker build -t transparency-ci:${{ github.sha }} .
      - name: Check built image against MySQL
        run: >-
          docker run --rm --network host
          --env DJANGO_SETTINGS_MODULE --env DB_ENGINE
          --env MYSQL_HOST --env MYSQL_PORT --env MYSQL_DATABASE
          --env MYSQL_USER --env MYSQL_PASSWORD
          transparency-ci:${{ github.sha }}
          python manage.py shell -c
          "from django.test import Client; assert Client().get('/health/ready/').status_code == 200"
