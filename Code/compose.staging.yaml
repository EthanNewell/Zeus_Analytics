name: transparency-staging
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--sql-mode=STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION"]
    volumes: ["mysql_staging:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $$MYSQL_USER -D $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    logging:
      options: {max-size: "10m", max-file: "3"}
  web:
    image: ${APP_IMAGE:?Set APP_IMAGE to an immutable release tag}
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.staging
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Set DJANGO_ALLOWED_HOSTS},127.0.0.1
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:?Set DJANGO_CSRF_TRUSTED_ORIGINS}
      DB_ENGINE: mysql
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      APP_VERSION: ${APP_VERSION:?Set APP_VERSION}
      ENABLE_SYNTHETIC_LOGIN: ${ENABLE_SYNTHETIC_LOGIN:-1}
      MAX_IMPORT_BYTES: ${MAX_IMPORT_BYTES:-2097152}
      MAX_IMPORT_ROWS: ${MAX_IMPORT_ROWS:-500}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes: ["media_staging:/app/media"]
    depends_on:
      db: {condition: service_healthy}
    logging:
      options: {max-size: "10m", max-file: "3"}
  proxy:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/tls:/etc/nginx/tls:ro
    depends_on:
      web: {condition: service_healthy}
    logging:
      options: {max-size: "10m", max-file: "3"}
volumes:
  mysql_staging:
  media_staging:
