name: transparency-local
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-transparency}
      MYSQL_USER: ${MYSQL_USER:-transparency}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Copy .env.example to .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Copy .env.example to .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--sql-mode=STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION"]
    volumes:
      - mysql_local:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $$MYSQL_USER -D $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
  web:
    build: .
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Copy .env.example to .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1]}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      DB_ENGINE: mysql
      MYSQL_HOST: db
      MYSQL_DATABASE: ${MYSQL_DATABASE:-transparency}
      MYSQL_USER: ${MYSQL_USER:-transparency}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Copy .env.example to .env}
      APP_VERSION: ${APP_VERSION:-2026.11.22}
      ENABLE_SYNTHETIC_LOGIN: ${ENABLE_SYNTHETIC_LOGIN:-0}
      MAX_IMPORT_BYTES: ${MAX_IMPORT_BYTES:-2097152}
      MAX_IMPORT_ROWS: ${MAX_IMPORT_ROWS:-500}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - media_local:/app/media
    depends_on:
      db:
        condition: service_healthy
volumes:
  mysql_local:
  media_local:
