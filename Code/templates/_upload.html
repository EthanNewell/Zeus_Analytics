{# The one upload window: opened by any [data-upload-open] button; a card passes its object in data-case. #}
<div class="modal-scrim" data-upload-scrim></div>
<form class="modal upload" data-upload method="post" enctype="multipart/form-data" action="{% url 'dashboard:document_upload' %}" role="dialog" aria-modal="true" aria-labelledby="upload-h" tabindex="-1">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  {{ document_form.case }}
  <div class="modal-head"><h2 id="upload-h">Загрузить документ</h2><button class="modal-close" type="button" data-upload-close aria-label="Закрыть"><svg class="icon"><use href="#i-x"/></svg></button></div>
  <div class="modal-body">
    <label class="drop" data-drop>
      <input class="sr-only" type="file" name="file" accept=".pdf,.docx,.xlsx,.jpg,.jpeg,.png,.tif,.tiff" required data-file>
      <svg class="drop-art" viewBox="0 0 196 96" aria-hidden="true">
        <g transform="rotate(-5 34 48)"><rect x="6" y="10" width="58" height="76" rx="6" fill="#f9e6ec"/><text x="16" y="34" fill="#b0245a" font-size="17" font-weight="600" font-family="var(--sans)">PDF</text><rect x="14" y="58" width="32" height="5" rx="2.5" fill="#b0245a"/><rect x="14" y="68" width="42" height="5" rx="2.5" fill="#b0245a"/></g>
        <g><rect x="70" y="10" width="58" height="76" rx="6" fill="#e6edf9"/><text x="78" y="34" fill="#2d5fb4" font-size="17" font-weight="600" font-family="var(--sans)">DOC</text><rect x="78" y="58" width="32" height="5" rx="2.5" fill="#2d5fb4"/><rect x="78" y="68" width="42" height="5" rx="2.5" fill="#2d5fb4"/></g>
        <g transform="rotate(8 162 48)"><rect x="134" y="10" width="58" height="76" rx="6" fill="#e8f9e3"/><text x="141" y="34" fill="#2fa61b" font-size="17" font-weight="600" font-style="italic" font-family="var(--sans)">XLSX</text><rect x="142" y="58" width="32" height="5" rx="2.5" fill="#2fa61b"/><rect x="142" y="68" width="42" height="5" rx="2.5" fill="#2fa61b"/></g>
      </svg>
      <span class="drop-title">Перетащите файл или выберите на компьютере</span>
      <span class="drop-hint">Форматы: PDF, DOCX, XLSX, JPG, PNG, TIFF, до 5 МБ</span>
      <span class="drop-btn">выбрать файл</span>
      <span class="drop-file" data-file-row hidden><svg class="icon" aria-hidden="true"><use href="#i-doc"/></svg><span><span class="t-compact" data-file-name></span><span class="soft t-label" data-file-size></span></span><button class="modal-close" type="button" data-file-clear aria-label="Убрать файл"><svg class="icon"><use href="#i-x"/></svg></button></span>
      <span class="drop-error" data-file-error hidden></span>
    </label>
    {{ document_form.kind }}
    {{ document_form.source }}
    {{ document_form.note }}
  </div>
  <button class="modal-submit" type="submit" disabled data-upload-submit>загрузить</button>
</form>
