{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход · Код прозрачности</title>
  <link rel="stylesheet" href="{% static 'auth/login.css' %}">
  <script type="module" src="{% static 'auth/login.js' %}"></script>
</head>
<body class="auth-page">
  <main class="auth-shell">
    <aside class="brand-panel" aria-label="Код прозрачности">
      <div class="brand-name"><span class="brand-symbol" aria-hidden="true"><i></i><i></i><i></i></span>Код прозрачности</div>
      <img class="parcel-diagram" alt="" width="360" height="208" src="{% static 'brand/parcels.svg' %}">
      <p class="workplace">Рабочее место<br>специалиста</p>
    </aside>
    <div class="auth-content">
      {% for message in messages %}<p role="status">{{ message }}</p>{% endfor %}
      <form method="post" action="{% url 'accounts:login' %}">
        {% csrf_token %}
        {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
        {% include 'registration/_auth_card.html' %}
      </form>
    </div>
  </main>
</body>
</html>
