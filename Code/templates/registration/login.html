{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход · Код прозрачности</title>
  <link rel="stylesheet" href="{% static 'auth/login.css' %}">
  <script type="module" src="{% static 'auth/login.js' %}"></script>
</head>
<body class="auth-page">
  <main class="auth-shell">
    <div class="brand-panel"><img src="{% static 'brand/login.webp' %}" alt="Зевс. Прозрачность в каждом изменении. Интеллектуальная система мониторинга земельных объектов." fetchpriority="high"></div>
    <div class="auth-content">
      {% for message in messages %}<p role="status">{{ message }}</p>{% endfor %}
      <form method="post" action="{% url 'accounts:login' %}">
        {% csrf_token %}
        {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
        {% include 'registration/_auth_card.html' %}
      </form>
    </div>
  </main>
</body>
</html>
